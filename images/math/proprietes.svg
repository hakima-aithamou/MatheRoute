<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#e1f4ff"/><stop offset="1" stop-color="#fff9e9"/></linearGradient></defs><rect width="480" height="240" rx="20" fill="url(#bg)"/><text x="240" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="40" fill="#173c62">7 + 5 = 5 + 7</text><text x="240" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="34" fill="#2f9a74">6 + 0 = 6</text></svg>